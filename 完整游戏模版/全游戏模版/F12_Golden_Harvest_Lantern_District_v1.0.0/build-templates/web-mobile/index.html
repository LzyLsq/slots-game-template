<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Golden Harvest — Lantern District</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="csw-preloader" role="status" aria-label="Loading Golden Harvest Lantern District">
    <img src="golden-harvest-loader-bg.jpg" class="loading-backdrop" alt="" aria-hidden="true">
    <div class="salon-light" aria-hidden="true"></div>
    <div class="harvest-glow" aria-hidden="true"></div>
    <div class="loading-sign">
      <div class="brand-lockup" aria-label="Golden Harvest Lantern District">
        <img src="golden-harvest-emblem.png" class="brand-emblem" alt="">
        <div class="brand-copy"><p class="brand-kicker">GOLDEN HARVEST</p><p class="brand-name">LANTERN DISTRICT</p></div>
      </div>
      <p class="invitation">Lanterns glow. Fortune gathers.</p>
      <div class="loading-track is-indeterminate" role="progressbar" aria-label="Preparing game" id="loading-track"><span id="loading-progress"></span></div>
      <p id="loading-copy">Lighting the harvest district…</p>
      <p class="loading-hint">Your next visit will load faster.</p>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <p class="virtual-notice">Virtual coins · No cash value or cash-out</p>
  </div>
  <div id="GameDiv" cc_exact_fit_screen="true"><div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0" aria-label="Golden Harvest Lantern District game"></canvas></div></div>
  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <script src="bootstrap.js" charset="utf-8"></script>
</body>
</html>
