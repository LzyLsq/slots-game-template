<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Cocos EditBox creates inline CSS for its native DOM input overlay. Scripts remain restricted to self. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>F15 · Honey Parade</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="audio/credits.js"></script>
</head>
<body>
  <div id="csw-preloader" role="status" aria-label="Loading Honey Parade">
    <div class="salon-light"></div>
    <div class="loading-sign">
      <img src="cloud-crown.webp" class="wordmark" alt="Honey Parade">
      <p class="invitation">Your passage to a world of treasure.</p>
      <div class="loading-track"><span id="loading-progress"></span></div>
      <p id="loading-copy">Charting your golden route…</p>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <p class="virtual-notice">Virtual coins · No cash value or cash-out</p>
  </div>
  <div id="GameDiv" cc_exact_fit_screen="true"><div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0" aria-label="Honey Parade game"></canvas></div></div>
  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <script src="bootstrap.js" charset="utf-8"></script>
</body>
</html>
